<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanConnect - AI Crop Recommendation</title>
    <meta name="description" content="KisanConnect – Smart AI-powered crop recommendation based on soil nutrients and local weather.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── User bar (top-right, above lang toggle) ── */
        .user-bar {
            position: fixed;
            top: 14px;
            right: 18px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 6px 14px 6px 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1b4332;
            border: 1px solid rgba(45,106,79,0.15);
        }
        .user-bar .avatar {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.9rem;
        }
        .user-bar .logout-btn {
            width: auto; padding: 5px 12px;
            font-size: 0.78rem; font-weight: 700;
            border-radius: 20px;
            background: linear-gradient(135deg, #2d6a4f, #40916c);
            color: #fff; border: none; cursor: pointer;
            box-shadow: 0 2px 8px rgba(45,106,79,0.3);
            transition: all 0.2s ease;
        }
        .user-bar .logout-btn:hover {
            background: linear-gradient(135deg, #b91c1c, #ef4444);
            box-shadow: 0 2px 8px rgba(185,28,28,0.3);
            transform: none;
        }
    </style>
</head>
<body>
    <!-- ── Auth guard: runs before render ── -->
    <script>
        (function() {
            var user = sessionStorage.getItem('kc_user');
            if (!user) { window.location.replace('login.html'); }
        })();
    </script>

    <!-- ── User bar ── -->
    <div class="user-bar" id="user-bar">
        <div class="avatar" id="user-avatar">👤</div>
        <span id="user-name-display">…</span>
        <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>

    <div class="background-overlay"></div>
    <div class="container">
        <div class="lang-toggle">
            <button id="btn-en" class="active">English</button>
            <button id="btn-hi">हिंदी</button>
        </div>
        <header>
            <div class="logo-box">
                <img src="logo.png" alt="KisanConnect Logo" class="logo-icon">
                <h1 data-i18n="title">KisanConnect</h1>
            </div>
            <p data-i18n="subtitle">Smart, AI-Powered Crop Recommendations for Your Farm</p>
        </header>

        <main>
            <div class="card form-card">
                <h2 data-i18n="form_title">Enter Soil &amp; Location Details</h2>
                <form id="prediction-form">
                    <div class="input-group">
                        <div class="input-field">
                            <label for="N" data-i18n="n_label">Nitrogen (N)</label>
                            <input type="number" id="N" name="N" placeholder="e.g., 90" required>
                        </div>
                        <div class="input-field">
                            <label for="P" data-i18n="p_label">Phosphorus (P)</label>
                            <input type="number" id="P" name="P" placeholder="e.g., 42" required>
                        </div>
                        <div class="input-field">
                            <label for="K" data-i18n="k_label">Potassium (K)</label>
                            <input type="number" id="K" name="K" placeholder="e.g., 43" required>
                        </div>
                        <div class="input-field">
                            <label for="ph" data-i18n="ph_label">Soil pH</label>
                            <input type="number" step="0.1" id="ph" name="ph" placeholder="e.g., 6.5" required>
                        </div>
                    </div>
                    
                    <div class="input-field location-field">
                        <label for="location" data-i18n="loc_label">City/Town (for Weather Data)</label>
                        <div class="location-input-wrapper">
                            <input type="text" id="location" name="location" placeholder="e.g., Pune, India" required>
                            <button type="button" id="get-location-btn" class="icon-btn" title="Get My Location">📍</button>
                        </div>
                    </div>

                    <button type="button" id="submit-btn">
                        <span id="btn-text" data-i18n="submit_btn">Get Recommendation</span>
                        <div class="spinner" id="spinner" style="display: none;"></div>
                    </button>
                    <div id="form-alert" class="form-alert" aria-live="polite"></div>
                </form>
            </div>

            <div class="card result-card" id="result-card" style="display: none;">
                <div id="suitability-alert" class="suitability-alert" style="display: none;"></div>
                <h2 data-i18n="result_title">Recommended Crops</h2>
                
                <div class="top-crops-container" id="top-crops">
                    <!-- Dynamic top 3 crops will go here -->
                </div>
                
                <div class="explanation-box" id="explanation-box">
                    <h3 data-i18n="why_suitable_title">Why is this suitable?</h3>
                    <p id="explanation-text"></p>
                </div>
                
                <p class="weather-info" id="weather-info">Based on your soil and local weather.</p>
                <button class="reset-btn" onclick="resetForm()" data-i18n="reset_btn">Check Another</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
