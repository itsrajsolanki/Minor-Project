<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanConnect – Login</title>
    <meta name="description" content="Login or register to access KisanConnect's AI-powered crop recommendation system.">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <div class="logo-area">
            <img src="logo.png" alt="KisanConnect Logo">
            <h1>KisanConnect</h1>
            <p>AI-Powered Crop Recommendation System</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher" role="tablist">
            <button class="tab-btn active" id="tab-login" role="tab"
                    aria-selected="true"  aria-controls="panel-login"  onclick="switchTab('login')">
                🔑 Login
            </button>
            <button class="tab-btn" id="tab-register" role="tab"
                    aria-selected="false" aria-controls="panel-register" onclick="switchTab('register')">
                ✨ Register
            </button>
        </div>

        <!-- ── LOGIN PANEL ─────────────────────────────────────── -->
        <div class="form-panel active" id="panel-login" role="tabpanel">
            <div class="alert" id="login-alert" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="login-username">Username</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="login-username" placeholder="Enter your username"
                               autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="input-wrap has-eye">
                        <span class="icon">🔒</span>
                        <input type="password" id="login-password" placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="eye-toggle" id="login-eye"
                                aria-label="Toggle password visibility" onclick="toggleEye('login-password','login-eye')">
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="login-btn">
                    <span id="login-btn-text">Login</span>
                    <div class="btn-spinner" id="login-spinner"></div>
                </button>
            </form>
        </div>

        <!-- ── REGISTER PANEL ──────────────────────────────────── -->
        <div class="form-panel" id="panel-register" role="tabpanel">
            <div class="alert" id="reg-alert" role="alert"></div>

            <form id="register-form" novalidate>
                <div class="field">
                    <label for="reg-username">Username</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="reg-username" placeholder="Choose a username (min 3 chars)"
                               autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label for="reg-email">Email</label>
                    <div class="input-wrap">
                        <span class="icon">✉️</span>
                        <input type="email" id="reg-email" placeholder="you@example.com"
                               autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="reg-password">Password</label>
                    <div class="input-wrap has-eye">
                        <span class="icon">🔒</span>
                        <input type="password" id="reg-password" placeholder="Minimum 6 characters"
                               autocomplete="new-password" required>
                        <button type="button" class="eye-toggle" id="reg-eye"
                                aria-label="Toggle password visibility" onclick="toggleEye('reg-password','reg-eye')">
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="reg-btn">
                    <span id="reg-btn-text">Create Account</span>
                    <div class="btn-spinner" id="reg-spinner"></div>
                </button>
            </form>
        </div>

        <p class="card-footer">🌾 Empowering farmers with AI since 2024</p>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
